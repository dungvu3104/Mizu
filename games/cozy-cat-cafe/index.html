<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e9d6bf">
<title>Cozy Cat Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="room">
  <div class="glow"></div><div class="window"></div><div class="sofa"></div><div class="blanket"></div>
  <svg class="plant" viewBox="0 0 100 120"><path d="M30 80 L70 80 L64 118 L36 118Z" fill="#c98b62"/><g fill="#7f9a6a"><ellipse cx="50" cy="50" rx="10" ry="30"/><ellipse cx="32" cy="58" rx="9" ry="24" transform="rotate(-35 32 58)"/><ellipse cx="68" cy="58" rx="9" ry="24" transform="rotate(35 68 58)"/><ellipse cx="22" cy="70" rx="7" ry="16" transform="rotate(-60 22 70)"/><ellipse cx="78" cy="70" rx="7" ry="16" transform="rotate(60 78 70)"/></g></svg>
  <svg class="lights" viewBox="0 0 400 80" preserveAspectRatio="none" id="lights"></svg>
</div>
<div id="app">
  <header><div class="sign">LEVEL <b id="lvl">1</b></div><div class="sign" id="nextLvl">NEXT LEVEL &#9654;</div><div class="sign">SERVED <b id="doneN">0/0</b></div></header>
  <div id="coming"><div class="sign" id="upNext">COMING UP <span id="nx"></span></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="tip"></div>
</div>
<div id="overlay"><div class="card"><h2 id="ovT"></h2><p id="ovS"></p><div class="cta" id="ovB">Next</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
