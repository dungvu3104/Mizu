<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crumble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #222842 0%, #10131c 70%);
  }
  canvas {
    touch-action: none; display: block; border-radius: 18px; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
    animation: enter 0.6s cubic-bezier(0.2, 1.3, 0.4, 1) both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { canvas { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------- constants ----------
const VW = 360, VH = 640;          // logical screen
const GW = 48, PH = 48, GH = 56;   // grid: picture is 48x48, extra rows below for falling
const CS = 7;                      // cell size in logical px
const BX = 12, BY = 160;
const EMPTY = 0, SOLID = 1, SAND = 2;
const NSLOT = 3;                   // buckets shown on top
const BMAX = 120;                  // max grains per bucket
const LX = 6, RX = 354;            // side tubes
const CY = BY + GH * CS + 11;      // two collector tubes under the picture
const BAR = { x: 20, y: 118, w: 320, h: 30 };   // capacity bar, under the baskets
const BARY = BAR.y + BAR.h / 2;
const SPEED = 1000;                // sand speed inside the tube, px per second
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

// ---------- easing ----------
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOutCubic = t => 1 - (1 - t) ** 3;
const easeInCubic = t => t * t * t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- level painting helpers ----------
function painter() {
  const g = new Uint8Array(GW * PH);
  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < GW && y >= 0 && y < PH) g[y * GW + x] = c; };
  const rect = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, c); };
  const ell = (cx, cy, rx, ry, c, o = {}) => {
    for (let y = 0; y < PH; y++) for (let x = 0; x < GW; x++) {
      if (o.ymax !== undefined && y > o.ymax) continue;
      if (o.ymin !== undefined && y < o.ymin) continue;
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[y * GW + x] = c;
    }
  };
  const ring = (cx, cy, r0, r1, c, ymax) => {
    for (let y = 0; y <= ymax; y++) for (let x = 0; x < GW; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d > r0 && d <= r1) g[y * GW + x] = c;
    }
  };
  return { g, set, rect, ell, ring };
}

// solve:  one known good tap order (cell coords). The bucket queue on top is built from it.
// cap:    size of the bottom bar as a fraction of all sand in the level.
// ice:    patches that cannot be tapped until a patch touching them crumbles.
// hidden: patches whose colour is covered until a patch touching them crumbles.
const LEVELS = [
  { // popsicle
    name: 'Popsicle', tip: 'Tap a shape to crumble it into the baskets',
    cap: 1, hint: [23, 40],
    pal: ['#ff6f91', '#ffd166', '#c98f5a'],
    solve: [[23, 40], [23, 28], [23, 10]],
    draw(p) {
      p.ell(23.5, 13, 10, 10, 1); p.rect(14, 13, 33, 21, 1);
      p.rect(14, 22, 33, 33, 2);
      p.rect(21, 34, 26, 45, 3);
    }
  },
  { // mushroom
    name: 'Mushroom', tip: 'Sand with no matching basket fills the storage bar',
    cap: 0.3, hint: [10, 41],
    pal: ['#ef4b4b', '#fff7ea', '#e8c08a', '#5ecb6b'],
    solve: [[10, 41], [23, 30], [8, 21], [14, 17], [25, 12], [34, 18]],
    draw(p) {
      p.ell(23.5, 23, 20, 16, 1, { ymax: 23 });
      p.ell(14, 17, 3, 2.5, 2); p.ell(25, 12, 4, 3, 2); p.ell(34, 18, 3, 2.5, 2);
      p.rect(17, 24, 30, 38, 3);
      p.rect(6, 39, 41, 43, 4);
    }
  },
  { // rainbow
    name: 'Rainbow', tip: 'Watch the basket queue and plan ahead',
    cap: 0.22,
    pal: ['#ff5964', '#ff9f43', '#ffe14d', '#4cd97b', '#4aa8ff', '#a06bff', '#f4f7ff'],
    solve: [[23, 29], [23, 26], [7, 39], [40, 39], [23, 23], [23, 20], [23, 17], [23, 14]],
    draw(p) {
      for (let k = 0; k < 6; k++) p.ring(23.5, 36, 20 - k * 3, 23 - k * 3, k + 1, 36);
      p.ell(7, 39, 7.5, 4.5, 7); p.ell(40, 39, 7.5, 4.5, 7);
    }
  },
  { // cactus: the pot is frozen
    name: 'Cactus', tip: 'Frozen pieces thaw when a neighbour crumbles',
    cap: 0.3,
    pal: ['#4fbf6a', '#d9824f', '#ff7eb6'],
    solve: [[23, 20], [23, 38], [23, 8]],
    ice: [[23, 38]],
    draw(p) {
      p.rect(21, 12, 26, 33, 1);
      p.rect(13, 18, 16, 26, 1); p.rect(17, 23, 20, 26, 1);
      p.rect(31, 15, 34, 24, 1); p.rect(27, 21, 30, 24, 1);
      p.rect(16, 34, 31, 35, 2); p.rect(18, 36, 29, 42, 2);
      p.ell(23.5, 9, 3.5, 3, 3);
    }
  },
  { // burger
    name: 'Burger', tip: 'Small pieces count too',
    cap: 0.2,
    pal: ['#e8a857', '#fff6dc', '#62c462', '#f0503c', '#ffd23f', '#7a4a2b'],
    solve: [[23, 34], [20, 29], [23, 24], [23, 22], [23, 19], [23, 15], [15, 10], [23, 8], [30, 11], [20, 13], [27, 14]],
    draw(p) {
      p.ell(23.5, 17, 18, 12, 1, { ymax: 17 });
      p.rect(15, 10, 16, 10, 2); p.rect(23, 8, 24, 8, 2); p.rect(30, 11, 31, 11, 2); p.rect(20, 13, 21, 13, 2); p.rect(27, 14, 28, 14, 2);
      p.rect(7, 21, 40, 23, 4);
      p.rect(4, 18, 43, 20, 3); for (let x = 4; x <= 43; x++) if (x % 4 < 2) p.set(x, 21, 3);
      p.rect(6, 26, 41, 31, 6);
      p.rect(5, 24, 42, 25, 5); p.rect(9, 26, 11, 27, 5); p.rect(30, 26, 32, 28, 5);
      p.rect(7, 32, 40, 35, 1); p.ell(23.5, 35, 17, 4, 1, { ymin: 35 });
    }
  },
  { // balloons: two colours are covered
    name: 'Balloons', tip: 'Hidden colours appear when a neighbour crumbles',
    cap: 0.25,
    pal: ['#ef4b4b', '#4aa8ff', '#ffd23f', '#f4f7ff', '#9a6238'],
    solve: [[20, 40], [10, 30], [24, 30], [38, 30], [10, 14], [24, 10], [38, 14]],
    hidden: [[24, 10], [38, 14]],
    draw(p) {
      p.ell(10, 14, 7, 8, 1); p.ell(24, 10, 7, 8, 2); p.ell(38, 14, 7, 8, 3);
      p.rect(10, 23, 10, 36, 4); p.rect(24, 19, 24, 36, 4); p.rect(38, 23, 38, 36, 4);
      p.rect(6, 37, 42, 42, 5);
    }
  },
  { // house
    name: 'House', tip: 'The last one. Take your time',
    cap: 0.2,
    pal: ['#58c063', '#ffd972', '#9a6238', '#6ec3ff', '#e9524a', '#ffb347'],
    solve: [[10, 43], [7, 28], [9, 31], [23, 31], [16, 36], [38, 35], [39, 23], [16, 20], [24, 14], [41, 6]],
    draw(p) {
      p.rect(2, 42, 45, 45, 1);
      p.rect(6, 27, 27, 41, 2);
      p.rect(14, 33, 19, 41, 3);
      p.rect(8, 30, 11, 33, 4); p.rect(22, 30, 25, 33, 4);
      p.rect(23, 13, 26, 19, 3);
      for (let y = 14; y <= 26; y++) { const hw = (y - 14) * 1.1 + 1; for (let x = Math.ceil(16.5 - hw); x <= Math.floor(16.5 + hw); x++) p.set(x, y, 5); }
      p.rect(37, 31, 40, 41, 3);
      p.ell(39, 23, 7, 9, 1);
      p.ell(41, 6, 4, 4, 6);
    }
  },
];

// ---------- state ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = GW; off.height = GH;
const octx = off.getContext('2d'); const img = octx.createImageData(GW, GH);

let kind, col, reg, shade, pend;      // per-cell arrays
let pal, palRGB, palDark, palLight, slots, queue, bar, barOrder, barTotal, barCap, regions, state, stateT, tick, taps;
let grains = [], levelIdx = 0, now = 0, lastT = 0, frameDt = 0.016;
// visual-only state (never affects gameplay)
let parts = [], rings = [], leaving = [], shake = 0, flash = null, levelBorn = 0, barDisp, barSeen = [];
let hover = null, press = { id: null, t: -1e9 }, spinT = -1e9;
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
try { levelIdx = Math.min(LEVELS.length - 1, parseInt(localStorage.getItem('crumble_lvl') || '0', 10) || 0); } catch (e) {}

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbStr(c, f) {          // f < 0 darkens, f > 0 lightens
  const t = f < 0 ? 0 : 255, k = Math.abs(f);
  return `rgb(${Math.round(c[0] + (t - c[0]) * k)},${Math.round(c[1] + (t - c[1]) * k)},${Math.round(c[2] + (t - c[2]) * k)})`;
}
function newBucket(q) { return q ? { col: q.col, size: q.size, got: 0, arr: 0, born: now, closing: 0, disp: 0, bump: -1e9 } : null; }

function loadLevel(i) {
  levelIdx = i; const L = LEVELS[i];
  try { localStorage.setItem('crumble_lvl', String(i)); } catch (e) {}
  const p = painter(); L.draw(p);
  const N = GW * GH;
  kind = new Uint8Array(N); col = new Uint8Array(N); reg = new Int16Array(N).fill(-1);
  shade = new Int8Array(N); pend = new Float64Array(N);
  pal = L.pal; palRGB = pal.map(hexRGB);
  palDark = palRGB.map(c => rgbStr(c, -0.28)); palLight = palRGB.map(c => rgbStr(c, 0.45));
  let sum = 0;
  for (let j = 0; j < GW * PH; j++) if (p.g[j]) { kind[j] = SOLID; col[j] = p.g[j]; sum++; }
  // connected patches (4-neighbour, same colour)
  regions = [];
  for (let j = 0; j < GW * PH; j++) {
    if (kind[j] !== SOLID || reg[j] >= 0) continue;
    const id = regions.length, cells = [j]; reg[j] = id;
    for (let k = 0; k < cells.length; k++) {
      const c = cells[k], x = c % GW;
      for (const n of [c - GW, c + GW, x > 0 ? c - 1 : -1, x < GW - 1 ? c + 1 : -1]) {
        if (n >= 0 && n < GW * PH && kind[n] === SOLID && reg[n] < 0 && col[n] === col[j]) { reg[n] = id; cells.push(n); }
      }
    }
    regions.push({ cells, gone: false, ice: false, hidden: false, flash: -1e9, adj: new Set(), mark: cells[0] });
  }
  // which patches touch each other, and a centre cell for the icon
  for (let j = 0; j < GW * PH; j++) {
    if (reg[j] < 0) continue;
    for (const n of [j % GW < GW - 1 ? j + 1 : -1, j + GW < GW * PH ? j + GW : -1]) {
      if (n >= 0 && reg[n] >= 0 && reg[n] !== reg[j]) { regions[reg[j]].adj.add(reg[n]); regions[reg[n]].adj.add(reg[j]); }
    }
  }
  for (const r of regions) {
    let sx = 0, sy = 0; for (const c of r.cells) { sx += c % GW; sy += (c / GW) | 0; }
    sx /= r.cells.length; sy /= r.cells.length; let bd = 1e9;
    for (const c of r.cells) { const d = (c % GW - sx) ** 2 + (((c / GW) | 0) - sy) ** 2; if (d < bd) { bd = d; r.mark = c; } }
  }
  for (const [x, y] of L.ice || []) regions[reg[y * GW + x]].ice = true;
  for (const [x, y] of L.hidden || []) regions[reg[y * GW + x]].hidden = true;
  // bucket queue: follow the known solve order, merge same-colour runs, split into buckets
  const used = new Set(), runs = [];
  const addRun = id => { if (id < 0 || used.has(id)) return; used.add(id); const c = col[regions[id].cells[0]], n = regions[id].cells.length; const last = runs[runs.length - 1]; if (last && last.col === c) last.n += n; else runs.push({ col: c, n }); };
  for (const [x, y] of L.solve) addRun(reg[y * GW + x]);
  for (let id = 0; id < regions.length; id++) addRun(id);
  queue = [];
  for (const r of runs) { const k = Math.ceil(r.n / BMAX); for (let b = 0; b < k; b++) queue.push({ col: r.col, size: Math.floor(r.n / k) + (b < r.n % k ? 1 : 0) }); }
  slots = []; for (let k = 0; k < NSLOT; k++) slots.push(newBucket(queue.shift()));
  bar = new Int32Array(pal.length + 1); barOrder = []; barTotal = 0; barCap = Math.max(40, Math.round(sum * L.cap));
  grains = []; state = 'play'; stateT = now; tick = 0; taps = 0;
  // visuals: staggered basket entrance, picture build-in, clean effects
  slots.forEach((s, k) => { if (s) s.born = now + 120 + k * 90; });
  parts = []; rings = []; leaving = []; shake = 0; flash = null; levelBorn = now;
  barDisp = new Float32Array(pal.length + 1); barSeen = [];
}

// ---------- audio (tiny, optional) ----------
let ac = null, lastTick = 0;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function blip(f0, f1, dur, type = 'sine', vol = 0.12) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function grainTick() { if (now - lastTick < 45) return; lastTick = now; blip(1800 + Math.random() * 1400, 900, 0.03, 'triangle', 0.025); }

// ---------- effects (visual only) ----------
function spawn(p) { if (parts.length < 700) parts.push(p); }
function burst(x, y, c, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = o.angle !== undefined ? o.angle + (Math.random() - 0.5) * (o.spread || 1) : Math.random() * Math.PI * 2;
    const v = (o.spd || 120) * (0.4 + Math.random() * 0.8);
    spawn({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.g ?? 300, drag: o.drag ?? 2,
      life: 0, max: (o.life || 0.6) * (0.7 + Math.random() * 0.6), size: (o.size || 3) * (0.6 + Math.random() * 0.8),
      c: Array.isArray(c) ? c[(Math.random() * c.length) | 0] : c, shape: o.shape || 'sq', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14,
    });
  }
}
function ring(x, y, c, r0, r1, dur, w = 3) { rings.push({ x, y, c, r0, r1, dur, w, t0: now }); }
function addShake(m) { if (!reduceMotion) shake = Math.max(shake, m); }
function cellXY(c) { return [BX + (c % GW + 0.5) * CS, BY + (((c / GW) | 0) + 0.5) * CS]; }

function updateFx(dt) {
  const live = parts; parts = [];
  for (const p of live) {
    p.life += dt; if (p.life >= p.max) continue;
    const dr = Math.exp(-p.drag * dt); p.vx *= dr; p.vy *= dr; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y < VH + 40) parts.push(p);
  }
  rings = rings.filter(r => now - r.t0 < r.dur);
  leaving = leaving.filter(b => now - b.t0 < 340);
  shake *= Math.exp(-dt * 11); if (shake < 0.05) shake = 0;
}

// ---------- game logic ----------
function slotPos(k) { return { x: 22 + k * 82, y: 44, w: 66, h: 64 }; }
function openBucket(c) { return slots.findIndex(s => s && s.col === c && !s.closing && s.got < s.size); }

// a grain left the bottom of the picture: it rides the nearest tube up to the bar
function collect(c, x) {
  const fx = BX + (x + 0.5) * CS, left = fx < VW / 2, sx = left ? LX : RX, ex = left ? BAR.x + 6 : BAR.x + BAR.w - 6;
  grains.push({ c, pts: [[fx, CY], [sx, CY], [sx, BARY], [ex, BARY]], seg: 0, x: fx, y: CY, ox: (Math.random() - 0.5) * 5, oy: (Math.random() - 0.5) * 5 });
}

function toBucket(k, x, y) {     // one grain hops from the bar level into basket k
  const s = slots[k], p = slotPos(k); s.got++;
  const tx = p.x + p.w / 2 + (Math.random() - 0.5) * 20, ty = p.y + p.h - 16;
  grains.push({ c: s.col, hop: true, s, pts: [[x, y], [tx, ty]], seg: 0, x, y, ox: 0, oy: 0, L: Math.max(1, Math.hypot(tx - x, ty - y)), arc: 14 + Math.random() * 16 });
  grainTick();
  if (s.got >= s.size) {
    s.closing = now; blip(520, 1040, 0.16, 'sine', 0.16); if (navigator.vibrate) navigator.vibrate(18);
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    burst(cx, cy, ['#ffffff', pal[s.col - 1], palLight[s.col - 1]], 18, { spd: 170, g: 120, life: 0.6, size: 3.2, shape: 'spark' });
    ring(cx, cy, pal[s.col - 1], 20, 52, 380, 4);
  }
}

function arrive(c, x, y) {       // top of the tube: matching basket, or stay in the bar
  const k = openBucket(c);
  if (k >= 0) { toBucket(k, x, y); return; }
  if (!bar[c]) barOrder.push(c);
  bar[c]++; barTotal++;
  if (barTotal > barCap && state === 'play') {
    state = 'fail'; stateT = now; blip(220, 70, 0.5, 'sawtooth', 0.12); if (navigator.vibrate) navigator.vibrate(120);
    addShake(9); flash = { c: '255,77,94', t0: now, dur: 450, a: 0.35 };
    burst(BAR.x + BAR.w / 2, BARY, pal.slice(), 40, { spd: 260, g: 500, life: 0.9, size: 3.5 });
  }
}

function drainBar() {            // stored sand leaves the bar when its basket shows up
  if (state === 'fail') return;
  let x = BAR.x;
  for (const c of barOrder) {
    const w = bar[c] / barCap * BAR.w;
    for (let n = 0; n < 5 && bar[c] > 0; n++) {
      const k = openBucket(c); if (k < 0) break;
      bar[c]--; barTotal--; toBucket(k, x + Math.random() * Math.max(4, w), BARY);
    }
    x += w;
  }
  barOrder = barOrder.filter(c => bar[c] > 0);
}

function moveGrains(dt) {
  const live = grains; grains = [];
  for (const g of live) {
    let stepLeft = SPEED * dt;
    while (stepLeft > 0 && g.seg < g.pts.length - 1) {
      const t = g.pts[g.seg + 1], dx = t[0] - g.x, dy = t[1] - g.y, d = Math.hypot(dx, dy);
      if (d <= stepLeft) { g.x = t[0]; g.y = t[1]; g.seg++; stepLeft -= d; }
      else { g.x += dx / d * stepLeft; g.y += dy / d * stepLeft; stepLeft = 0; }
    }
    if (g.seg < g.pts.length - 1) grains.push(g);
    else if (!g.hop) arrive(g.c, g.x, g.y);
    else if (g.s) {               // landed in a basket: little squash + splash
      g.s.bump = now; g.s.arr++;
      if (Math.random() < 0.25) burst(g.x, g.y - 4, pal[g.c - 1], 1, { angle: -Math.PI / 2, spread: 2, spd: 70, g: 400, life: 0.35, size: 2.4 });
    }
  }
}

function step() {
  tick++;
  for (let y = GH - 1; y >= 0; y--) {
    const ltr = (tick + y) & 1;
    for (let k = 0; k < GW; k++) {
      const x = ltr ? k : GW - 1 - k, i = y * GW + x;
      if (kind[i] !== SAND) continue;
      if (y === GH - 1) { kind[i] = EMPTY; collect(col[i], x); continue; }
      const d = i + GW;
      let to = -1;
      if (kind[d] === EMPTY) { if (Math.random() < 0.05) continue; to = d; }
      else {
        const s = Math.random() < 0.5 ? -1 : 1;
        if (x + s >= 0 && x + s < GW && kind[d + s] === EMPTY && kind[i + s] === EMPTY) to = d + s;
        else if (x - s >= 0 && x - s < GW && kind[d - s] === EMPTY && kind[i - s] === EMPTY) to = d - s;
      }
      if (to >= 0) { kind[to] = SAND; col[to] = col[i]; shade[to] = shade[i]; kind[i] = EMPTY; }
    }
  }
}

function crumble(regionId, cx, cy) {
  const r = regions[regionId]; if (!r || r.gone) return false;
  const sx = BX + (cx + 0.5) * CS, sy = BY + (cy + 0.5) * CS;
  if (r.ice) {                   // frozen: cannot be tapped yet
    r.flash = now; blip(1500, 1300, 0.07, 'square', 0.05);
    r.wiggle = now; ring(sx, sy, 'rgba(200,236,255,0.9)', 6, 22, 260, 2);
    burst(sx, sy, ['#e6f6ff', '#bfe6ff'], 5, { spd: 90, g: 200, life: 0.35, size: 2.5, shape: 'spark' });
    return false;
  }
  r.gone = true; r.hidden = false; taps++;
  for (const c of r.cells) {
    const x = c % GW, y = (c / GW) | 0;
    pend[c] = now + 60 + Math.min(420, Math.hypot(x - cx, y - cy) * 14);
  }
  for (const n of r.adj) {       // patches touching this one thaw and uncover
    const o = regions[n]; if (o.gone) continue;

function tapCell(gx, gy) {

function update(dt) {

        if (Math.random() < 0.1) { const [px, py] = cellXY(i); burst(px, py, palLight[col[i] - 1], 1, { spd: 60, g: -20, drag: 3, life: 0.6, size: 3, shape: 'dot' }); }
      }

  for (let k = 0; k < NSLOT; k++) if (slots[k] && slots[k].closing && now - slots[k].closing > 260) {
    leaving.push({ k, col: slots[k].col, t0: now });

    flash = { c: '255,255,255', t0: now, dur: 380, a: 0.25 };
    const cols = pal.concat(['#ffffff']);

    burst(10, 600, cols, 35, { angle: -Math.PI / 3, spread: 0.7, spd: 780, g: 520, drag: 1.4, life: 2.6, size: 4.5, shape: 'conf' });
    burst(VW - 10, 600, cols, 35, { angle: -Math.PI * 2 / 3, spread: 0.7, spd: 780, g: 520, drag: 1.4, life: 2.6, size: 4.5, shape: 'conf' });

// ---------- rendering ----------

const BOKEH = Array.from({ length: 9 }, (_, i) => ({ x: (i * 97) % VW, y: (i * 173) % VH, r: 30 + (i * 37) % 60, s: 0.3 + (i % 4) * 0.15, p: i * 1.7 }));
function drawBackground() {

  ctx.fillStyle = bg; ctx.fillRect(-20, -20, VW + 40, VH + 40);

function drawBoard() {
  const d = img.data, age = now - levelBorn;
  for (let i = 0; i < GW * GH; i++) {
    const o = i * 4, k = kind[i];
    if (k === EMPTY) { d[o + 3] = 0; continue; }
    let c = palRGB[col[i] - 1], m = 1, w = 0, a = 1;
    if (k === SAND) m = 1 + shade[i] / 100;
    else {
      const x = i % GW, y = (i / GW) | 0, R = regions[reg[i]];
      const below = i + GW < GW * GH ? i + GW : -1, right = x < GW - 1 ? i + 1 : -1;
      if (below < 0 || kind[below] !== SOLID || reg[below] !== reg[i] || right < 0 || kind[right] !== SOLID || reg[right] !== reg[i]) m = 0.86;
      else if (i - GW < 0 || kind[i - GW] !== SOLID || reg[i - GW] !== reg[i]) m = 1.08;
      if (R.hidden) c = (x + y) & 1 ? [98, 108, 132] : [88, 98, 122];                 // covered: colour unknown
      else if (R.ice) {
        const sh = (x + y + ((now / 90) | 0)) % 14 === 0 ? 0.92 : (x + y) % 6 === 0 ? 0.85 : 0.6;
        c = [c[0] + (205 - c[0]) * sh, c[1] + (236 - c[1]) * sh, c[2] + (255 - c[2]) * sh];
      }
      if (pend[i]) w = 0.25 + 0.5 * clamp01(1 - (pend[i] - now) / 480);                // brightens just before it crumbles
      else if (now - R.flash < 260) w = 0.65 * (1 - (now - R.flash) / 260);
      // build-in: the picture assembles from the top when a level starts

        a = t; w = Math.max(w, (1 - t) * 0.8);

    d[o + 2] = Math.min(255, c[2] * m + (255 - c[2] * m) * w); d[o + 3] = 255 * a;

  ctx.fillStyle = '#161a27'; rr(BX - 3, BY - 3, GW * CS + 6, GH * CS + 6, 10); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; rr(BX - 2.5, BY - 2.5, GW * CS + 5, GH * CS + 5, 9.5); ctx.stroke();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, BX, BY, GW * CS, GH * CS);

    const px = BX + (r.mark % GW + 0.5) * CS, py = BY + (((r.mark / GW) | 0) + 0.5) * CS;
    let wx = 0;
    if (r.wiggle && now - r.wiggle < 300) { const t = (now - r.wiggle) / 300; wx = Math.sin(t * Math.PI * 6) * 4 * (1 - t); }
    if (r.hidden) {
      const by = Math.sin(now / 380 + r.mark) * 2;
      ctx.beginPath(); ctx.arc(px, py + by, 12, 0, 7); ctx.fillStyle = 'rgba(20,24,38,0.35)'; ctx.fill();
      text('?', px, py + by + 1, 18, 'rgba(255,255,255,0.95)', 800);
    } else {
      ctx.save(); ctx.translate(px + wx, py); ctx.rotate(Math.sin(now / 900) * 0.25);
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';

}

function tubePath() {
  ctx.beginPath(); ctx.moveTo(BAR.x + 4, BARY); ctx.lineTo(LX, BARY); ctx.lineTo(LX, CY); ctx.lineTo(RX, CY); ctx.lineTo(RX, BARY); ctx.lineTo(BAR.x + BAR.w - 4, BARY);

function drawGrains() {

function drawBucket(k) {

  let cx = lerp(qx, p.x + p.w / 2, e), cy = lerp(qy, p.y + p.h / 2, e) - Math.sin(tb * Math.PI) * 14;

function drawQueue() {           // small preview of the next buckets, sliding along as they are used
  text('NEXT', 291, 40, 7, 'rgba(255,255,255,0.4)', 800);
  for (let i = 0; i < Math.min(6, queue.length); i++) {
    const q = queue[i], tx = 276 + (i % 2) * 30, ty = 48 + ((i / 2) | 0) * 21;
    if (q.vx === undefined) { q.vx = tx + 20; q.vy = ty; q.va = 0; }

function drawBar() {
  const b = BAR, f = Math.min(1, barTotal / barCap);

  for (let c = 1; c < barDisp.length; c++) { barDisp[c] += (bar[c] - barDisp[c]) * k; dispTotal += barDisp[c]; }

  // title + progress dots
  const tIn = easeOutCubic(clamp01((now - levelBorn) / 400));
  ctx.save(); ctx.globalAlpha = tIn; ctx.translate(0, (1 - tIn) * -6);
  text(`LEVEL ${levelIdx + 1}`, 160, 13, 12, '#ffffff', 800);
  text(LEVELS[levelIdx].name.toUpperCase(), 160, 25, 8, 'rgba(255,255,255,0.5)', 700);
  ctx.restore();
  const n = LEVELS.length, x0 = 160 - (n - 1) * 7;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * 14, cur = i === levelIdx;
    const r = cur ? 4 + Math.sin(now / 300) * 0.6 : 2.6;
    if (cur) { ctx.beginPath(); ctx.arc(x, 36, r + 3, 0, 7); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, 36, r, 0, 7);
    ctx.fillStyle = i < levelIdx ? '#7fe3a0' : cur ? '#ffffff' : 'rgba(255,255,255,0.22)'; ctx.fill();
  }
}

function drawRings() {
  for (const r of rings) {
    const t = clamp01((now - r.t0) / r.dur), e = easeOutCubic(t);
    ctx.globalAlpha = 1 - t; ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - t * 0.6);
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r0, r.r1, e), 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParts() {
  for (const p of parts) {
    const k = 1 - p.life / p.max;
    ctx.globalAlpha = p.shape === 'conf' ? Math.min(1, k * 3) : k; ctx.fillStyle = p.c;
    if (p.shape === 'conf') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 1.7));
      ctx.fillRect(-p.size, -p.size * 0.6, p.size * 2, p.size * 1.2); ctx.restore();
    } else if (p.shape === 'spark') {
      const s = p.size * (0.4 + k * 0.8);
      ctx.beginPath(); ctx.moveTo(p.x, p.y - s * 1.6); ctx.lineTo(p.x + s * 0.35, p.y - s * 0.35); ctx.lineTo(p.x + s * 1.6, p.y);
      ctx.lineTo(p.x + s * 0.35, p.y + s * 0.35); ctx.lineTo(p.x, p.y + s * 1.6); ctx.lineTo(p.x - s * 0.35, p.y + s * 0.35);
      ctx.lineTo(p.x - s * 1.6, p.y); ctx.lineTo(p.x - s * 0.35, p.y - s * 0.35); ctx.fill();
    } else if (p.shape === 'dot') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.3 + 0.7 * k), 0, 7); ctx.fill();
    } else {
      const s = p.size * (0.5 + 0.5 * k); ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHint() {
  const L = LEVELS[levelIdx];
  if (!(L.hint && taps === 0 && state === 'play' && now - levelBorn > 700)) return;
  const hx = BX + (L.hint[0] + 0.5) * CS, hy = BY + (L.hint[1] + 0.5) * CS;
  for (let j = 0; j < 2; j++) {
    const t = ((now + j * 550) % 1100) / 1100;
    ctx.strokeStyle = `rgba(255,255,255,${(1 - t) * 0.9})`; ctx.lineWidth = 3 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(hx, hy, 8 + easeOutCubic(t) * 24, 0, 7); ctx.stroke();
  }
  const t = (now % 1100) / 1100, pr = Math.sin(t * Math.PI);
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(hx, hy, 8 - pr * 2, 0, 7); ctx.fill();
  // label bubble
  const by = hy - 38 + Math.sin(now / 260) * 3;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 8;
  rr(hx - 22, by - 11, 44, 22, 11); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(hx - 5, by + 10); ctx.lineTo(hx + 5, by + 10); ctx.lineTo(hx, by + 16); ctx.fillStyle = '#ffffff'; ctx.fill();
  text('TAP', hx, by + 1, 11, '#2b3350', 900);
}

function drawTip() {
  const tip = LEVELS[levelIdx].tip; if (!tip || state !== 'play') return;
  const a = easeOutCubic(clamp01((now - levelBorn - 500) / 500));
  ctx.save(); ctx.globalAlpha = a * 0.6; ctx.translate(0, (1 - a) * 8);
  text(tip, VW / 2, 604, 12, '#ffffff', 600);
  ctx.restore();
}

function drawOverlay() {
  if (state === 'play') return;
  const win = state === 'win', t = clamp01((now - stateT - (win ? 500 : 200)) / 380);
  if (t <= 0) return;
  ctx.fillStyle = `rgba(12,14,22,${0.62 * easeOutCubic(t)})`; ctx.fillRect(0, 0, VW, VH);
  const e = easeOutBack(t), cx = VW / 2, cy = 330, w = 250, h = 200;
  ctx.save(); ctx.globalAlpha = Math.min(1, t * 2.5);
  ctx.translate(cx, cy); ctx.scale(0.7 + 0.3 * e, 0.7 + 0.3 * e); ctx.translate(-cx, -cy);
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(cx - w / 2, cy - h / 2, w, h, 22);
  const cg = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2); cg.addColorStop(0, '#343d61'); cg.addColorStop(1, '#262d49');
  ctx.fillStyle = cg; ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.stroke();
  // icon badge, popping in a little after the card
  const it = easeOutBack(clamp01((now - stateT - (win ? 650 : 330)) / 400)), ic = win ? '#4cd97b' : '#ff4d5e', iy = cy - h / 2 + 4;
  ctx.save(); ctx.translate(cx, iy); ctx.scale(it, it);
  if (win) {                     // rotating rays behind the badge
    ctx.save(); ctx.rotate(now / 1800); ctx.fillStyle = 'rgba(76,217,123,0.16)';
    for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-7, -62); ctx.lineTo(7, -62); ctx.fill(); }
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fillStyle = ic; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = '#262d49'; ctx.stroke();
  if (win) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-13, 1); ctx.lineTo(-4, 11); ctx.lineTo(14, -9); ctx.stroke(); }
  else iconRestart(0, 0, 15, '#fff');
  ctx.restore();
  const last = levelIdx === LEVELS.length - 1;
  text(win ? (last ? 'All levels cleared!' : 'Level complete!') : 'Storage overflow!', cx, cy + 4, 21, '#ffffff', 800);
  text(win ? `${LEVELS[levelIdx].name} crumbled in ${taps} tap${taps === 1 ? '' : 's'}` : 'Too much sand had nowhere to go', cx, cy + 32, 12, 'rgba(255,255,255,0.6)', 600);
  const ready = now - stateT > (win ? 600 : 350), pulse = 0.5 + 0.5 * Math.sin(now / 280);
  rr(cx - 80, cy + 55, 160, 32, 16); ctx.fillStyle = ic; ctx.globalAlpha *= ready ? 0.85 + 0.15 * pulse : 0.4; ctx.fill();
  text(win ? (last ? 'Play again' : 'Next level') : 'Try again', cx, cy + 72, 13, '#ffffff', 800);
  ctx.restore();
}

function render() {
  ctx.setTransform(cv.width / VW, 0, 0, cv.height / VH, 0, 0);
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
  drawBackground();
  drawTopBar();
  drawTube();
  drawLeaving();
  for (let k = 0; k < NSLOT; k++) drawBucket(k);
  drawQueue();
  drawBoard();
  drawBar();
  drawGrains();
  drawRings();
  drawParts();
  drawHint();
  drawTip();
  ctx.restore();
  if (flash) {
    const t = (now - flash.t0) / flash.dur;
    if (t >= 1) flash = null; else { ctx.fillStyle = `rgba(${flash.c},${flash.a * (1 - t)})`; ctx.fillRect(0, 0, VW, VH); }
  }
  drawOverlay();
  const ft = clamp01((now - levelBorn) / 320);  // level transition fade
  if (ft < 1) { ctx.fillStyle = `rgba(16,19,28,${0.7 * (1 - easeOutCubic(ft))})`; ctx.fillRect(0, 0, VW, VH); }
}

// ---------- loop + input ----------
function frame(t) { const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; now = t; frameDt = dt || 0.016; update(dt); render(); requestAnimationFrame(frame); }

function fit() {
  const s = Math.min(innerWidth / VW, innerHeight / VH), dpr = Math.min(3, devicePixelRatio || 1);
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  cv.width = Math.round(VW * s * dpr); cv.height = Math.round(VH * s * dpr);
}
addEventListener('resize', fit); fit();

function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH]; }

cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const [x, y] = toLogical(e), id = hitButton(x, y);
  hover = id && btnEnabled(id) ? id : null;
  const overBoard = state === 'play' && x >= BX && x < BX + GW * CS && y >= BY && y < BY + PH * CS;
  cv.style.cursor = hover || state !== 'play' || overBoard ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { hover = null; cv.style.cursor = 'default'; });

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const a = audio(); if (a && a.state === 'suspended') a.resume();
  const [x, y] = toLogical(e);
  const btn = hitButton(x, y);
  if (btn === 'prev') {
    press = { id: 'prev', t: now };
    if (levelIdx > 0) { loadLevel(levelIdx - 1); blip(600, 400, 0.08, 'sine', 0.06); }
    return;
  }
  if (btn === 'next') {
    press = { id: 'next', t: now };
    if (levelIdx < LEVELS.length - 1) { loadLevel(levelIdx + 1); blip(400, 600, 0.08, 'sine', 0.06); }
    return;
  }
  if (state === 'win') { if (now - stateT > 600) loadLevel((levelIdx + 1) % LEVELS.length); return; }
  if (state === 'fail') { if (now - stateT > 350) loadLevel(levelIdx); return; }
  if (btn === 'restart') { press = { id: 'restart', t: now }; spinT = now; loadLevel(levelIdx); return; }
  if (!tapCell(Math.floor((x - BX) / CS), Math.floor((y - BY) / CS)) && y >= BY && y < BY + PH * CS) {
    ring(x, y, 'rgba(255,255,255,0.35)', 3, 14, 220, 2);   // missed tap: small soft ripple
  }
});

loadLevel(levelIdx);
requestAnimationFrame(frame);

// debug hooks for automated playtests
window.__game = {
  tap: tapCell, load: loadLevel, levels: LEVELS,
  info: () => ({ level: levelIdx, state, bar: barTotal, barCap, queue: queue.length, slots: slots.map(s => s && { col: s.col, got: s.got, size: s.size }) }),
};
</script>
</body>
</html>
